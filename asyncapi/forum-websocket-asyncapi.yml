    Trade:
      name: Trade
      summary: Public trade
      description: A single executed trade on the market.
      payload:
        type: object
        required:
          - type
          - channel
          - ticker
          - data
        properties:
          type:
            type: string
            const: trade
          channel:
            type: string
            const: trades
          ticker:
            type: string
            example: OPENAI
          data:
            type: object
            properties:
              askPrice:
                type: number
                example: 10600
              bidPrice:
                type: number
                example: 10500
              quantity:
                type: number
                example: 5
              takerSide:
                type: string
                enum:
                  - buy
                  - sell
                example: buy
              timestamp:
                type: string
                format: date-time
                description: Execution timestamp (ISO 8601)
                example: '2026-02-25T12:00:00.100Z'
      examples:
        - payload:
            type: trade
            channel: trades
            ticker: OPENAI
            data:
              askPrice: 10600
              bidPrice: 10500
              quantity: 5
              takerSide: buy
              timestamp: '2026-02-25T12:00:00.100Z'
    IndexUpdate:
      name: Index update
      summary: Live attention index update
      description: Real-time index value change with source breakdown.
      payload:
        type: object
        required:
          - type
          - channel
          - ticker
          - data
        properties:
          type:
            type: string
            const: indexUpdate
          channel:
            type: string
            const: indexUpdates
          ticker:
            type: string
            description: Market ticker (derived from index name by removing `-IDX` suffix)
            example: OPENAI
          data:
            type: object
            required:
              - name
              - value
              - timestamp
              - updatedSourceConfigs
            properties:
              name:
                type: string
                description: Full index name
                example: OPENAI-IDX
              value:
                type: number
                description: Current index value
                example: 100.6
              timestamp:
                type: string
                format: date-time
                example: '2026-02-25T12:00:00.000Z'
              updatedSourceConfigs:
                type: array
                description: >-
                  Source configurations with current values. See `GET
                  /indices/{name}` for the full schema.
                items:
                  type: object
      examples:
        - payload:
            type: indexUpdate
            channel: indexUpdates
            ticker: OPENAI
            data:
              name: OPENAI-IDX
              value: 100.6
              timestamp: '2026-02-25T12:00:00.000Z'
              updatedSourceConfigs:
                - name: youtube
                  displayName: YouTube
                  picture: https://example.com/youtube.png
                  weight: 0.5
                  frequency: 3600
                  currValue: 50
                  hasHistory: true
                  metrics:
                    - shortName: new_videos
                      displayName: New videos
                      weight: 0.7
                      type: raw
                      curr:
                        value: 100000
                        diff: 500
                      frequency: 3600
                      hasHistory: true
    FundingEvent:
      name: Funding event
      summary: Funding event
      payload:
        type: object
        required:
          - type
          - channel
          - ticker
          - data
        properties:
          type:
            type: string
            const: fundingEvent
          channel:
            type: string
            const: fundingEvents
          ticker:
            type: string
            example: OPENAI
          data:
            type: object
            required:
              - fundingRate
              - timestamp
            properties:
              fundingRate:
                type: number
                example: 0.0001
              timestamp:
                type: string
                format: date-time
                example: '2026-02-25T08:00:00.000Z'
      examples:
        - payload:
            type: fundingEvent
            channel: fundingEvents
            ticker: OPENAI
            data:
              fundingRate: 0.0001
              timestamp: '2026-02-25T08:00:00.000Z'
    CandleUpdate:
      name: Candle update
      summary: Live candlestick update
      payload:
        type: object
        required:
          - type
          - channel
          - ticker
          - data
        properties:
          type:
            type: string
            const: candleUpdate
          channel:
            type: string
            description: >-
              Channel name (e.g., `candleUpdates1m`, `candleUpdates5m`,
              `candleUpdates1d`)
            example: candleUpdates1m
          ticker:
            type: string
            example: OPENAI
          data:
            type: object
            required:
              - interval
              - open
              - high
              - low
              - close
              - volume
            properties:
              interval:
                type: string
                enum:
                  - 1m
                  - 5m
                  - 1d
                example: 1m
              start:
                type: string
                format: date-time
                description: Candle period start time
                example: '2026-02-25T12:00:00.000Z'
              open:
                type: number
                example: 10500
              high:
                type: number
                example: 10600
              low:
                type: number
                example: 10450
              close:
                type: number
                example: 10550
              volume:
                type: number
                example: 150
              active:
                type: boolean
                description: Whether this candle is still open
                example: true
      examples:
        - payload:
            type: candleUpdate
            channel: candleUpdates1m
            ticker: OPENAI
            data:
              interval: 1m
              start: '2026-02-25T12:00:00.000Z'
              open: 10500
              high: 10600
              low: 10450
              close: 10550
              volume: 150
              active: true
    Heartbeat:
      name: Heartbeat
      summary: Application-level heartbeat
      description: Sent every 1 second per subscribed ticker.
      payload:
        type: object
        required:
          - type
          - channel
          - ticker
          - timestamp
        properties:
          type:
            type: string
            const: heartbeat
          channel:
            type: string
            const: heartbeat
          ticker:
            type: string
            example: OPENAI
          timestamp:
            type: string
            format: date-time
            example: '2026-02-25T12:00:00.000Z'
      examples:
        - payload:
            type: heartbeat
            channel: heartbeat
            ticker: OPENAI
            timestamp: '2026-02-25T12:00:00.000Z'
    OrderUpdate:
      name: Order update
      summary: Order state change
      description: Streams all order state transitions for the authenticated user.
      payload:
        type: object
        required:
          - type
          - channel
          - data
        properties:
          type:
            type: string
            const: orderUpdate
          channel:
            type: string
            const: userOrders
          data:
            type: object
            description: Full order record
            properties:
              id:
                type: integer
                example: 12345
              createdAt:
                type: string
                format: date-time
                example: '2026-02-25T12:00:00.000Z'
              updatedAt:
                type:
                  - string
                  - 'null'
                format: date-time
                example: '2026-02-25T12:00:01.000Z'
              clientOrderId:
                type: string
                example: my-order-001
              userId:
                type: integer
                example: 42
              ticker:
                type: string
                example: OPENAI
              side:
                type: string
                enum:
                  - buy
                  - sell
                example: buy
              orderType:
                type: string
                enum:
                  - market
                  - limit
                example: limit
              timeInForce:
                type:
                  - string
                  - 'null'
                enum:
                  - goodTillCancel
                  - fillOrKill
                  - fillAndKill
                  - null
                description: Time-in-force policy. Null for market orders.
                example: goodTillCancel
              price:
                type:
                  - number
                  - 'null'
                example: 10050
              quantity:
                type: number
                example: 10
              remainingQuantity:
                type: number
                example: 5
              status:
                type: string
                enum:
                  - resting
                  - partiallyFilled
                  - filled
                  - cancelled
                  - rejected
                example: partiallyFilled
              engineOrderId:
                type:
                  - integer
                  - 'null'
                example: 456
              lockedNotional:
                type: number
                example: 50250
              postOnly:
                type: boolean
                example: false
              reduceOnly:
                type: boolean
                example: false
              selfTradePreventionMode:
                type: string
                enum:
                  - cr
                  - ci
                  - cb
                example: cr
      examples:
        - payload:
            type: orderUpdate
            channel: userOrders
            data:
              id: 12345
              createdAt: '2026-02-25T12:00:00.000Z'
              updatedAt: '2026-02-25T12:00:01.000Z'
              clientOrderId: my-order-001
              userId: 42
              ticker: OPENAI
              side: buy
              orderType: limit
              timeInForce: goodTillCancel
              price: 10050
              quantity: 10
              remainingQuantity: 5
              status: partiallyFilled
              engineOrderId: 456
              lockedNotional: 50250
              postOnly: false
              reduceOnly: false
              selfTradePreventionMode: cr
    FillEvent:
      name: Fill
      summary: Trade execution
      payload:
        type: object
        required:
          - type
