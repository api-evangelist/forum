                type: integer
                example: 5678
              orderId:
                type: integer
                example: 12345
              qty:
                type: number
                example: 5
              ticker:
                type: string
                example: OPENAI
              isTaker:
                type: boolean
                example: true
              side:
                type: string
                enum:
