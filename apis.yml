aid: forum
name: Forum
description: >-
  Forum is a centralized exchange offering exposure to engagement-backed assets —
  "the first exchange to trade on attention." It turns online attention across
  social, search, and streaming data into measurable, tradable attention indices,
  then lists continuous perpetual-style futures contracts on top of them so
  participants can go long or short on cultural relevance as a new asset class.
  Forum (Y Combinator W26, based in New York City) exposes a full public developer
  surface: an OpenAPI 3.1 REST API at api.forum.market/v1 for market data, order
  management, positions, and account queries, and an AsyncAPI 3.0 WebSocket feed at
  wss://api.forum.market/ws/v1 for real-time order book, ticker, trade, index, and
  funding updates. Authentication is HMAC-SHA256 request signing with read/trade
  API-key permissions, and the docs ship an agent-native discovery surface
  (llms.txt, agent-card, agent-skills, and a documentation MCP server).
